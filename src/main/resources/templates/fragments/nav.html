<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="nav" class="navbar">
	<a class="brand" th:href="@{/dashboard}">
		<svg class="brand-mark" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
			<path d="M2 12h4l2-7 4 14 3-9 2 4h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
		</svg>
		VitalTrack
	</a>
	<div class="nav-links">
		<a th:href="@{/dashboard}" th:text="#{nav.monitoring}">모니터링</a>
		<a th:href="@{/subjects}" th:text="#{nav.subjects}">측정 대상</a>
		<a th:href="@{/history}" th:text="#{nav.history}">이력</a>
		<a th:href="@{/report}" th:text="#{nav.report}">활동 리포트</a>
		<a th:href="@{/simulator}" th:text="#{nav.simulator}">시뮬레이터(폰 대체)</a>
		<!-- 선택한 언어로 현재 페이지를 다시 요청한다(?lang=ko|en) - LocaleChangeInterceptor가
		     이 파라미터를 보고 쿠키(LOCALE)를 갱신하므로, 이후 페이지 이동에서는 이 파라미터 없이도 유지된다. -->
		<select class="lang-select" aria-label="language" onchange="location.href=(location.pathname + '?lang=' + this.value)">
			<option value="ko" th:selected="${#locale.language == 'ko'}">한국어</option>
			<option value="en" th:selected="${#locale.language == 'en'}">English</option>
		</select>
		<span sec:authentication="name">사용자</span>
		<form th:action="@{/logout}" method="post" style="display:inline">
			<button type="submit" class="btn btn-outline" th:text="#{nav.logout}">로그아웃</button>
		</form>
	</div>
</div>
</body>
</html>
