<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">로그인 - VitalTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page page-narrow">
    <div class="card">
        <h1 th:text="#{login.heading}">VitalTrack 로그인</h1>
        <p th:if="${param.signup}" class="alert alert-success" th:text="#{login.alert.signupSuccess}">회원가입이 완료되었습니다. 로그인해주세요.</p>
        <p th:if="${param.error}" class="alert alert-error" th:text="#{login.alert.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p th:if="${param.logout}" class="alert alert-success" th:text="#{login.alert.logout}">로그아웃되었습니다.</p>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username" th:text="#{login.label.username}">아이디</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password" th:text="#{login.label.password}">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width:100%;" th:text="#{login.button.submit}">로그인</button>
        </form>
        <p class="text-muted text-sm" style="margin-top:16px;">
            <span th:text="#{login.noAccount}">계정이 없으신가요?</span> <a th:href="@{/signup}" th:text="#{login.link.signup}">회원가입</a>
        </p>
    </div>
</div>
</body>
</html>
