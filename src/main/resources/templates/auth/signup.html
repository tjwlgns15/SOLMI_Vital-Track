<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{signup.title}">회원가입 - VitalTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page page-narrow">
    <div class="card">
        <h1 th:text="#{signup.heading}">회원가입</h1>
        <p th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></p>
        <form th:action="@{/signup}" th:object="${signupRequest}" method="post">
            <div class="form-group">
                <label for="loginId" th:text="#{signup.label.loginId}">아이디</label>
                <input type="text" id="loginId" th:field="*{loginId}" required autofocus>
                <p class="error-text" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>
            </div>
            <div class="form-group">
                <label for="password" th:text="#{signup.label.password}">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" required>
                <p class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="form-group">
                <label for="name" th:text="#{signup.label.name}">이름</label>
                <input type="text" id="name" th:field="*{name}" required>
                <p class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
            </div>
            <button type="submit" class="btn" style="width:100%;" th:text="#{signup.button.submit}">가입하기</button>
        </form>
        <p class="text-muted text-sm" style="margin-top:16px;">
            <span th:text="#{signup.hasAccount}">이미 계정이 있으신가요?</span> <a th:href="@{/login}" th:text="#{signup.link.login}">로그인</a>
        </p>
    </div>
</div>
</body>
</html>
