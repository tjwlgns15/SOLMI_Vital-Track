<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>측정 대상 관리 - VitalTrack</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="page">
	<h1>측정 대상 관리</h1>

	<div class="card" style="margin-bottom:24px;">
		<h2>새 측정 대상 등록</h2>
		<form th:action="@{/subjects}" th:object="${registerRequest}" method="post">
			<div class="form-group">
				<label for="name">이름</label>
				<input type="text" id="name" th:field="*{name}" placeholder="예: 홍길동, 초코(강아지)" required>
				<p class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
			</div>
			<div class="form-group">
				<label for="type">종류</label>
				<select id="type" th:field="*{type}" required>
					<option value="">선택해주세요</option>
					<option th:each="t : ${subjectTypes}" th:value="${t}" th:text="${t.label}"></option>
				</select>
				<p class="error-text" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></p>
			</div>
			<div class="form-group">
				<label for="species">품종/비고 (동물인 경우)</label>
				<input type="text" id="species" th:field="*{species}" placeholder="예: 골든리트리버">
			</div>
			<button type="submit" class="btn">등록</button>
		</form>
	</div>

	<div class="card">
		<h2>등록된 측정 대상</h2>
		<table th:if="${not #lists.isEmpty(subjects)}">
			<thead>
			<tr>
				<th>이름</th>
				<th>종류</th>
				<th>품종/비고</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="s : ${subjects}">
				<td th:text="${s.name}"></td>
				<td>
					<span class="badge" th:classappend="${s.type.name() == 'HUMAN'} ? 'badge-human' : 'badge-animal'"
						th:text="${s.typeLabel}"></span>
				</td>
				<td th:text="${s.species} ?: '-'"></td>
			</tr>
			</tbody>
		</table>
		<p th:if="${#lists.isEmpty(subjects)}" class="empty-state">아직 등록된 측정 대상이 없습니다.</p>
	</div>
</div>
</body>
</html>
