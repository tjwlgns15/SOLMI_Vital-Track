<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title th:text="#{playback.title}">측정 이력 재생 - VitalTrack</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="page-wide">
	<div class="split-layout">
		<div class="map-panel">
			<div id="map"></div>
		</div>
		<div class="signal-panel">
			<div class="card" id="playback-header">
				<h2 id="subject-title" th:text="#{playback.loading}">불러오는 중...</h2>
				<p id="session-time" class="session-meta"></p>
			</div>

			<div class="subject-card">
				<div class="vitals-row">
					<div><span th:text="#{vitals.ecg}">ECG</span> <div class="value ecg-status">-</div></div>
					<div><span th:text="#{vitals.velocity}">속도</span> <div class="value velocity-value">-</div></div>
					<div><span th:text="#{vitals.location}">위치</span> <div class="value loc-status">-</div></div>
				</div>
				<canvas class="ecg-canvas" id="ecg-canvas" width="700" height="140"></canvas>
				<div class="accel-panel">
					<canvas class="accel-canvas" id="accel-canvas" width="700" height="110"></canvas>
					<!-- X/Y/Z legend overlays the bottom-left inside the canvas instead of taking its own row. -->
					<div class="accel-legend">
						<span class="accel-axis-label accel-axis-x">X</span>
						<span class="accel-axis-label accel-axis-y">Y</span>
						<span class="accel-axis-label accel-axis-z">Z</span>
					</div>
				</div>
			</div>

			<div class="card">
				<div class="playback-controls">
					<button id="play-btn" class="btn" th:text="#{playback.button.play}">▶ 재생</button>
					<select id="speed-select">
						<option value="1" th:text="#{playback.speed(1)}">1배속</option>
						<option value="2" th:text="#{playback.speed(2)}">2배속</option>
						<option value="4" th:text="#{playback.speed(4)}">4배속</option>
						<option value="8" th:text="#{playback.speed(8)}">8배속</option>
					</select>
					<span id="time-label" class="time-label">00:00 / 00:00</span>
				</div>
				<input type="range" id="seek-bar" min="0" max="1000" value="0">
			</div>
		</div>
	</div>
</div>

<script th:inline="javascript">
	/*<![CDATA[*/
	var SESSION_ID = /*[[${sessionId}]]*/ 0;
	var MESSAGES = {
		playing: /*[[#{playback.js.playing}]]*/ "재생 중",
		play: /*[[#{playback.button.play}]]*/ "▶ 재생",
		pause: /*[[#{playback.js.pause}]]*/ "⏸ 일시정지",
		loadError: /*[[#{playback.js.loadError}]]*/ "재생 데이터를 불러오지 못했습니다",
		errorPrefix: /*[[#{playback.js.errorPrefix}]]*/ "오류: "
	};
	/*]]>*/
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/playback.js}"></script>
</body>
</html>
