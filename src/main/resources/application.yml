server:
  port: 8027

spring:
  application:
    name: vital-track

  datasource:
    url: jdbc:mysql://localhost:3308/vital_track?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234

  flyway:
    # 기존에는 Hibernate의 ddl-auto: update가 스키마를 알아서 맞춰왔지만, 이제부터는
    # db/migration의 마이그레이션 스크립트가 스키마 변경의 유일한 경로가 된다.
    # 이미 ddl-auto: update로 만들어져 있는 기존 개발 DB에는 V1을 다시 실행하는 대신
    # "이미 V1까지 적용된 상태"로 기준선만 찍고(baseline), 그 이후 버전부터 실제로 적용한다.
    # (완전히 새로운/빈 DB에서는 baseline 없이 V1부터 정상적으로 실행된다.)
    baseline-on-migrate: true

  jpa:
    hibernate:
      # 스키마는 이제 Flyway가 관리하므로, Hibernate는 엔티티 매핑이 실제 스키마와
      # 일치하는지 검증만 하고 직접 스키마를 바꾸지는 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  thymeleaf:
    cache: false

app:
  jwt:
    # 데모/개발용으로 무작위 생성해 넣어둔 값입니다. 운영 환경에서는 반드시 환경변수 등으로
    # 외부에서 주입하고(예: JWT_SECRET), 이 파일에 평문으로 커밋하지 마세요.
    secret: "XKGg3roFZMKhMp76h4M0kDTaNy7TS7s6ZJsd99+X5ld6PmuWbsAp/PPB0ZT2vVsG"
    access-token-validity-seconds: 1800       # 30분 - 짧게 유지하고 재발급(refresh)으로 연장
    refresh-token-validity-seconds: 1209600   # 14일 - DB에 저장되어 있어 로그아웃 시 즉시 폐기 가능

logging:
  level:
    com.solmi.vitaltrack: debug
