# 모든 환경이 공유하는 설정. 환경마다 달라지는 값(DB 접속 정보, 포트, JWT 키, 로그 레벨 등)은
# 프로필 파일에 둔다.
#   - application-local.yml : 개발 PC (프로필을 지정하지 않으면 이 프로필로 뜬다)
#   - application-prod.yml  : 운영 PC (--spring.profiles.active=prod 로 실행)

server:
  port: 8027

spring:
  application:
    name: vital-track

  profiles:
    # 프로필 없이 실행하면(IDE 실행, 테스트) 개발 설정을 쓴다. 운영에서는 반드시 prod를 명시한다.
    default: local

  flyway:
    # 기존에는 Hibernate의 ddl-auto: update가 스키마를 알아서 맞춰왔지만, 이제부터는
    # db/migration의 마이그레이션 스크립트가 스키마 변경의 유일한 경로가 된다.
    # 이미 ddl-auto: update로 만들어져 있는 기존 개발 DB에는 V1을 다시 실행하는 대신
    # "이미 V1까지 적용된 상태"로 기준선만 찍고(baseline), 그 이후 버전부터 실제로 적용한다.
    # (완전히 새로운/빈 DB에서는 baseline 없이 V1부터 정상적으로 실행된다.)
    baseline-on-migrate: true

  jpa:
    hibernate:
      # 스키마는 이제 Flyway가 관리하므로, Hibernate는 엔티티 매핑이 실제 스키마와
      # 일치하는지 검증만 하고 직접 스키마를 바꾸지는 않는다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

app:
  jwt:
    # 서명 키(app.jwt.secret)는 환경마다 다른 값을 쓰므로 프로필 파일에서 정한다.
    access-token-validity-seconds: 1800       # 30분 - 짧게 유지하고 재발급(refresh)으로 연장
    refresh-token-validity-seconds: 1209600   # 14일 - DB에 저장되어 있어 로그아웃 시 즉시 폐기 가능
