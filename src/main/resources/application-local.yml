    # 절대 쓰지 않는다 (운영 값은 application-prod.yml 참고).
    secret: "XKGg3roFZMKhMp76h4M0kDTaNy7TS7s6ZJsd99+X5ld6PmuWbsAp/PPB0ZT2vVsG"

logging:
  level:
    com.solmi.vitaltrack: debug
