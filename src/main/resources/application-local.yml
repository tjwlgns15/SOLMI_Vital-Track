# 개발 PC 설정. 프로필을 지정하지 않으면 이 파일이 적용된다 (application.yml의 spring.profiles.default).
# 여기 있는 계정/키는 개발용이며 운영에서 쓰면 안 된다.

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/vital_track?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234

  thymeleaf:
    # 템플릿을 고치면 재시작 없이 바로 반영되도록 캐시를 끈다.
    cache: false

